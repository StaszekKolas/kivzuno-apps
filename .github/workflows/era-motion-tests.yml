name: KIVZUNO Era Motion tests

on:
  pull_request:
    paths:
      - "hub/era-motion/**"
      - "hub/index.html"
      - "netlify/functions/metrics.mjs"
      - "hub/stats.html"
      - "tests/era-motion.test.mjs"
      - "tests/runway-handoff.test.mjs"
      - "tests/no-login-lemon-pipeline.test.mjs"
      - "netlify/functions/era-image-task.mjs"
      - "netlify/functions/era-owner-test.mjs"
      - "tests/owner-beta.test.mjs"
      - "tests/film-first.test.mjs"
      - "tests/credit-budget.test.mjs"
      - "netlify/functions/lemon-*.mjs"
      - "netlify/functions/runway-handoff*.mjs"
      - ".github/workflows/era-motion-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check JavaScript and run no-network app tests
        run: |
          node --check hub/era-motion/studio-simple.js
          node --check hub/era-motion/runway-bridge.js
          node --check netlify/functions/runway-handoff.mjs
          node --check netlify/functions/runway-handoff-core.mjs
          node --check hub/era-motion/no-login-studio.js
          node --check netlify/functions/era-image-task.mjs
          node --check netlify/functions/era-owner-test.mjs
          node --check netlify/functions/lemon-commerce-core.mjs
          node --check netlify/functions/lemon-readiness.mjs
          node --test tests/era-motion.test.mjs tests/runway-handoff.test.mjs tests/no-login-lemon-pipeline.test.mjs tests/owner-beta.test.mjs tests/film-first.test.mjs tests/credit-budget.test.mjs
