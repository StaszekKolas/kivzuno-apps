name: KIVZUNO Runway handoff preview smoke

on:
  pull_request:
    paths:
      - "hub/era-motion/**"
      - "netlify/functions/runway-handoff*.mjs"
      - "tests/runway-handoff.test.mjs"
      - ".github/workflows/runway-handoff-smoke.yml"
permissions:
  contents: read
jobs:
  preflight-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify Netlify receives photo without billing or calling Runway
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          const base = "https://deploy-preview-"+process.env.PR_NUMBER+"--kivzuno-hub.netlify.app";
          const image = Buffer.concat([Buffer.from([255,216,255,224]),Buffer.alloc(3500,37),Buffer.from([255,217])]);
          const body = JSON.stringify({action:"preflight",era:"west",image:"data:image/jpeg;base64,"+image.toString("base64")});
          let last="";
          for(let attempt=1;attempt<=16;attempt++) {
            try {
              const homepage = await fetch(base+"/era-motion/",{signal:AbortSignal.timeout(9000)});
              const html=await homepage.text();
              if(!homepage.ok || !html.includes("studio-simple.js"))throw new Error("new app not yet deployed");
              const response = await fetch(base+"/.netlify/functions/runway-handoff",{
                method:"POST",
                headers:{"origin":base,"content-type":"application/json"},
                body,
                signal:AbortSignal.timeout(14000)
              });
              const data=await response.json();
              if(!response.ok || data?.ready!==true || data?.photoTransferred!==true || data?.charged!==false || data?.paymentActive!==false){
                throw new Error("handoff failed "+response.status+" "+JSON.stringify(data));
              }
              console.log("VERIFIED: Netlify preflight received photo bytes without generating a paid video",data.bytes,data.model,data.duration);
              process.exit(0);
            }catch(err){last=String(err.message).slice(0,200);console.log("Try "+attempt+": "+last);}
            if(attempt<16)await new Promise(resolve=>setTimeout(resolve,8000));
          }
          console.error("Handoff preview not verified: "+last);
          process.exit(1);
          JS
