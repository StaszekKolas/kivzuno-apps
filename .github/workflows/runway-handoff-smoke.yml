name: KIVZUNO private owner gate preview smoke

on:
  pull_request:
    paths:
      - "hub/era-motion/**"
      - "netlify/functions/runway-handoff*.mjs"
      - "netlify/functions/owner-*.mjs"
      - "netlify/edge-functions/**"
      - ".github/workflows/runway-handoff-smoke.yml"
permissions:
  contents: read
jobs:
  private-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify anonymous users cannot see private studio or start a paid job
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          const base="https://deploy-preview-"+process.env.PR_NUMBER+"--kivzuno-hub.netlify.app";
          let last="";
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const page=await fetch(base+"/era-motion/",{signal:AbortSignal.timeout(10000)});
              const text=await page.text();
              if(![401,503].includes(page.status))throw new Error("Private studio not protected, status="+page.status);
              if(text.includes("studio-simple.js"))throw new Error("Unauthenticated studio HTML leaked");
              const endpoints=[
                ["era-image-task",{action:"capabilities"}],
                ["owner-video-task",{action:"capabilities"}],
                ["owner-video-task",{action:"start",imageJobId:"test",consent:true}],
                ["runway-handoff",{action:"preflight",era:"medieval",image:"invalid"}]
              ];
              for(const [name,body] of endpoints){
                const res=await fetch(base+"/.netlify/functions/"+name,{
                  method:"POST",
                  headers:{origin:base,"content-type":"application/json"},
                  body:JSON.stringify(body),
                  signal:AbortSignal.timeout(10000)
                });
                if(![401,503].includes(res.status))
                  throw new Error(name+" allowed unauthenticated use, status="+res.status);
              }
              console.log("VERIFIED_PRIVATE_GATE: all anonymous image/video endpoints denied; no AI task called");
              process.exit(0);
            }catch(e){last=String(e.message||e);console.log("Attempt "+attempt+": "+last);}
            if(attempt<12)await new Promise(r=>setTimeout(r,6000));
          }
          throw Error("Private gate not verified: "+last);
          JS
