name: KIVZUNO website analytics dashboard tests

on:
  pull_request:
    paths:
      - 'hub/stats.html'
      - 'tests/kivzuno-dashboard.test.mjs'
      - '.github/workflows/kivzuno-dashboard-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify cookieless aggregate statistics dashboard
        run: node --test tests/kivzuno-dashboard.test.mjs
