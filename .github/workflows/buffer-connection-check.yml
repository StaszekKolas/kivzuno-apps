name: Buffer connectivity (read only)
# Manual-only; this workflow NEVER schedules or publishes posts.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/buffer/check-connection.mjs
      - name: Verify Buffer API key and three channels (read only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/buffer/check-connection.mjs
