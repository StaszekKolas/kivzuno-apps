name: KIVZUNO Era Motion static availability (not AI generation)

on:
  push:
    branches: [main]
    paths:
      - "hub/era-motion/**"
      - ".github/workflows/era-motion-live-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the currently deployed Era Motion static page, JS and CSS
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base="https://kivzuno-hub.netlify.app";
          // Real entry point (hub/era-motion/index.html) loads studio-simple.js,
          // not the older app.js. These checks never call image generation.
          const checks=[
            {path:"/era-motion/",type:"text/html",markers:[
              'src="./studio-simple.js"',
              'href="./style.css"',
              'id="photo"',
              'id="era"',
              'id="go"'
            ]},
            {path:"/era-motion/studio-simple.js",type:"javascript",markers:[
              'const $=id=>document.getElementById(id);',
              'action:"preflight"',
              'checkMode();'
            ]},
            {path:"/era-motion/style.css",type:"text/css",markers:[
              '.workspace{',
              '.creator,.preview{'
            ]}
          ];
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(let attempt=1;attempt<=12;attempt++){
            let allPass=true;
            for(const {path,type,markers} of checks){
              try{
                const response=await fetch(base+path,{signal:AbortSignal.timeout(9000),headers:{"cache-control":"no-cache"}});
                const body=await response.text();
                const mime=(response.headers.get("content-type")||"").toLowerCase();
                const missing=markers.filter(marker=>!body.includes(marker));
                if(!response.ok||!mime.includes(type)||missing.length){
                  allPass=false;
                  console.log("Attempt "+attempt+" FAIL "+path+
                    " status="+response.status+" mime="+mime+" missing="+JSON.stringify(missing));
                }else{
                  console.log("Attempt "+attempt+" PASS "+path+" status="+response.status);
                }
              }catch(err){
                allPass=false;
                console.log("Attempt "+attempt+" ERROR "+path+" "+String(err.message));
              }
            }
            if(allPass){
              console.log("ERA_MOTION_STATIC_FILES_VERIFIED. AI generation NOT tested.");
              process.exit(0);
            }
            if(attempt<12)await wait(6000);
          }
          console.error("ERA_MOTION_STATIC_FILES_NOT_VERIFIED. Investigate deployed assets; no AI generation attempted.");
          process.exit(1);
          JS
