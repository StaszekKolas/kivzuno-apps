name: KIVZUNO private owner & closed checkout readiness

on:
  pull_request:
    paths:
      - "netlify/functions/era-image-task.mjs"
      - "netlify/functions/owner-*.mjs"
      - "netlify/functions/lemon-*.mjs"
      - "netlify/edge-functions/**"
      - "hub/era-motion/**"
      - ".github/workflows/kivzuno-no-login-smoke.yml"
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify owner gate and no public payment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          const base="https://deploy-preview-"+process.env.PR_NUMBER+"--kivzuno-hub.netlify.app";
          let last="";
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const page=await fetch(base+"/era-motion/",{signal:AbortSignal.timeout(11000)});
              if(![401,503].includes(page.status))throw Error("Owner studio is publicly accessible");
              const image=await fetch(base+"/.netlify/functions/era-image-task",{
                method:"POST",headers:{origin:base,"content-type":"application/json"},
                body:JSON.stringify({action:"eligibility"}),signal:AbortSignal.timeout(11000)
              });
              if(![401,503].includes(image.status))throw Error("Unprotected image eligibility");
              const video=await fetch(base+"/.netlify/functions/owner-video-task",{
                method:"POST",headers:{origin:base,"content-type":"application/json"},
                body:JSON.stringify({action:"capabilities"}),signal:AbortSignal.timeout(11000)
              });
              if(![401,503].includes(video.status))throw Error("Unprotected owner video API");
              const payment=await fetch(base+"/.netlify/functions/lemon-readiness",{
                method:"POST",headers:{origin:base,"content-type":"application/json"},
                body:JSON.stringify({action:"capabilities"}),signal:AbortSignal.timeout(11000)
              });
              const data=await payment.json();
              if(!payment.ok||data.paymentActive!==false||data.checkoutReady!==false)
                throw Error("Unexpected public checkout");
              console.log("VERIFIED: private owner gate ON and public checkout OFF; no billable requests");
              process.exit(0);
            }catch(e){last=String(e?.message||e);console.log("Attempt "+attempt+": "+last);}
            if(attempt<12)await new Promise(r=>setTimeout(r,6000));
          }
          throw Error("Private/checkout smoke unsuccessful: "+last);
          JS
