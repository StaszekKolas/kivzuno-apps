name: KIVZUNO no-account readiness smoke

on:
  pull_request:
    paths:
      - "netlify/functions/era-image-task.mjs"
      - "netlify/functions/era-owner-test-core.mjs"
      - "netlify/functions/era-owner-video.mjs"
      - "netlify/functions/lemon-*.mjs"
      - "hub/era-motion/**"
      - "tests/no-login-lemon-pipeline.test.mjs"
      - ".github/workflows/kivzuno-no-login-smoke.yml"
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify no-login AI readiness and disabled checkout without triggering billable work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          const base="https://deploy-preview-"+process.env.PR_NUMBER+"--kivzuno-hub.netlify.app";
          let last="";
          for(let attempt=1;attempt<=14;attempt++){
            try{
              const page=await fetch(base+"/era-motion/",{signal:AbortSignal.timeout(10000)});
              const html=await page.text();
              if(!page.ok || !html.includes("studio-simple.js") || html.includes("js.puter.com"))
                throw new Error("new frontend is not yet deployed");
              for(const path of ["era-image-task","lemon-readiness"]){
                const res=await fetch(base+"/.netlify/functions/"+path,{
                  method:"POST",
                  headers:{"origin":base,"content-type":"application/json"},
                  body:JSON.stringify({action:"capabilities"}),
                  signal:AbortSignal.timeout(14000)
                });
                const data=await res.json();
                if(!res.ok)throw new Error(path+" response "+res.status+" "+JSON.stringify(data));
                if(path==="era-image-task" && (typeof data.available!=="boolean" || data.billingActive!==false || data.loginRequired!==false || data.customerPrice!==0))
                  throw new Error("image endpoint capability schema or customer price invalid");
                if(path==="lemon-readiness" && (data.paymentActive!==false || data.checkoutReady!==false))
                  throw new Error("unexpected live checkout");
                if(path==="era-image-task" && data.available===true){
                  const quotaRes=await fetch(base+"/.netlify/functions/era-image-task",{
                    method:"POST",headers:{"origin":base,"content-type":"application/json"},
                    body:JSON.stringify({action:"eligibility"}),
                    signal:AbortSignal.timeout(14000)
                  });
                  const quota=await quotaRes.json();
                  if(!quotaRes.ok || typeof quota.eligible!=="boolean")
                    throw new Error("Read-only quota check failed "+quotaRes.status+" "+JSON.stringify(quota));
                  console.log("VERIFIED_READ_ONLY_QUOTA eligibility="+String(quota.eligible)+" reset="+String(quota.resetAt||"none"));
                }
                console.log("VERIFIED_READINESS "+path+" image_available="+String(data.available===true)+" payment_active="+String(data.paymentActive===true)+"; no AI or payment call made");
              }
              // Security: unauthenticated anonymous browsers cannot spend
              // pre-paid Runway credits, even when the API key is in Netlify.
              for(const path of ["era-image-task","era-owner-video"]){
                const authless=await fetch(base+"/.netlify/functions/"+path,{
                  method:"POST",
                  headers:{"origin":base,"content-type":"application/json"},
                  body:JSON.stringify({action:"start",consent:true,era:"medieval",ownerApproval:true}),
                  signal:AbortSignal.timeout(14000)
                });
                const data=await authless.json();
                if(authless.status!==403 || data.error!=="owner_access_required")
                  throw new Error(path+" anonymous generation was not denied: "+authless.status+" "+JSON.stringify(data));
                console.log("OWNER_ONLY_DENIAL_VERIFIED "+path);
              }
              const videoCheck=await fetch(base+"/.netlify/functions/era-owner-video",{
                method:"POST",headers:{"origin":base,"content-type":"application/json"},
                body:JSON.stringify({action:"capabilities"}),signal:AbortSignal.timeout(14000)
              });
              const vid=await videoCheck.json();
              if(!videoCheck.ok || vid.videoAvailable!==false || vid.noCheckout!==true)
                throw new Error("Video owner access not locked");
              if(!html.includes('id="owner-workspace"') || !html.includes('id="owner-login"'))
                throw new Error("Owner-only web UI not present");
              console.log("VERIFIED_LOCKED_PRIVATE_OWNER_STUDIO_AND_VIDEO");
              process.exit(0);
            }catch(e){last=String(e?.message||e);console.log("Attempt "+attempt+": "+last);}
            if(attempt<14)await new Promise(resolve=>setTimeout(resolve,6000));
          }
          console.error("READINESS_UNVERIFIED: "+last);
          process.exit(1);
          JS
