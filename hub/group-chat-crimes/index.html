<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151028"><meta name="description" content="Five group chat crimes. One ridiculous verdict. Play the free 20-second KIVZUNO quiz."><title>Group Chat Crimes — KIVZUNO</title>
<style>
:root{color-scheme:dark;--bg:#151028;--ink:#fffaf4;--muted:#c8bdd9;--lime:#d5ff73;--pink:#ff8ac6;--edge:#ffffff29}*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 80% 5%,#57317d 0,transparent 45%),radial-gradient(ellipse at 0 100%,#3e1b55 0,transparent 47%),var(--bg)}.shell{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:15px;font-weight:950;letter-spacing:.2em}.logo b{color:var(--lime)}.pill{color:var(--lime);border:1px solid #d5ff7366;border-radius:50px;padding:7px 11px;letter-spacing:.06em;font-size:10px;font-weight:850}.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 0 24px}.eyebrow{color:var(--lime);font-size:12px;letter-spacing:.14em;font-weight:900;text-transform:uppercase}.heroart{font-size:68px;line-height:1.1;transform:rotate(-10deg);filter:drop-shadow(0 13px 18px #0006);margin:14px 0}h1{font-size:clamp(50px,12vw,72px);line-height:.96;letter-spacing:-.075em;margin:14px 0 19px}h1 em{font-style:normal;color:var(--lime)}.lead{font-size:19px;line-height:1.5;color:var(--muted);max-width:400px;margin:0 0 32px}.panel{background:linear-gradient(145deg,#302344,#20172f);border:1px solid var(--edge);box-shadow:0 18px 70px #0004;border-radius:26px;padding:25px 21px}.progress{height:7px;border-radius:20px;background:#ffffff22;margin:17px 0 27px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);transition:width .24s}.question{font-size:clamp(26px,7vw,38px);line-height:1.12;letter-spacing:-.05em;margin:4px 0 24px}.answers{display:grid;gap:11px}.answer,.button{appearance:none;border:1px solid #ffffff42;border-radius:15px;background:#ffffff0d;color:var(--ink);font:inherit;font-size:16px;font-weight:800;padding:16px 17px;min-height:56px;text-align:left;cursor:pointer;touch-action:manipulation}.answer:active{transform:scale(.985)}.answer:hover{border-color:var(--lime);background:#d5ff7318}.button{background:var(--lime);color:#1a102b;text-align:center;border-color:var(--lime);width:100%;letter-spacing:-.015em}.button.secondary{background:#ffffff12;border-color:var(--edge);color:var(--ink)}.button:focus-visible,.answer:focus-visible{outline:3px solid var(--pink);outline-offset:3px}.stack{display:grid;gap:10px;margin-top:23px}.meter{font-size:70px;line-height:1.1;margin:20px 0 6px}.verdict{font-size:clamp(33px,9vw,51px);line-height:.99;letter-spacing:-.06em;margin:8px 0 16px}.score{font-size:clamp(45px,12vw,64px);font-weight:950;color:var(--lime);letter-spacing:-.07em}.desc{font-size:17px;line-height:1.5;color:var(--muted);margin:12px 0 5px}.disclaimer{font-size:12px;line-height:1.45;color:var(--muted);text-align:center}.footer{display:flex;justify-content:space-between;gap:9px;color:#aca2bd;font-size:11px;border-top:1px solid var(--edge);padding-top:17px}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="logo">KIVZUNO <b>✳</b></div><span class="pill">FREE · NO LOGIN</span></header><main class="main" id="main" aria-live="polite"></main><footer class="footer"><span>NO SCIENCE. JUST CHAOS.</span><span>© KIVZUNO</span></footer></div>
<script>
"use strict";
const questions=[
 {q:"Someone types 'we need to talk'. You…",a:[["Go silent for 3 business days",0],["Ask 'about what?' immediately",1],["Reply with a dramatic GIF",2]]},
 {q:"A friend says 'be there in 5'. You…",a:[["Actually believe them",0],["Start the countdown",1],["Send 'it's been 6 minutes'",2]]},
 {q:"There are 87 unread messages. You…",a:[["Read every single one",0],["Ask for a summary",1],["React 😂 to something random",2]]},
 {q:"Someone accidentally sends a voice note. You…",a:[["Pretend nothing happened",0],["Ask if they're okay",1],["Change the group name to 'PODCAST'",2]]},
 {q:"The group chat is finally quiet. You…",a:[["Enjoy the peace",0],["Send one little meme",1],["Type 'guys…' and disappear",2]]}
];
const tiers=[
 {max:2,name:"THE INNOCENT LURKER",icon:"🕊️",line:"You saw the chaos. You chose peace. Allegedly."},
 {max:5,name:"THE SUSPICIOUS WITNESS",icon:"👀",line:"You say you hate drama, but you always know the details."},
 {max:8,name:"THE CHAOS ACCOMPLICE",icon:"🍿",line:"You did not start it. You definitely brought popcorn."},
 {max:10,name:"THE GROUP CHAT MENACE",icon:"🚨",line:"Notifications fear you. Your friends should too."}
];
let index=-1,score=0,answers=[],finished=false;
const main=document.getElementById("main");
function verdict(value){const n=Number(value);if(!Number.isInteger(n)||n<0||n>10)return null;return tiers.find(t=>n<=t.max);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function start(){index=0;score=0;answers=[];finished=false;history.replaceState(null,"",location.pathname);render();}
function choose(value){if(finished||index<0||index>=questions.length||![0,1,2].includes(value))return;answers.push(value);score+=value;index++;if(index===questions.length)finished=true;render();}
function render(){
 if(index<0&&!finished){main.innerHTML='<div class="eyebrow">THE 20-SECOND FRIENDSHIP TEST</div><div class="heroart" aria-hidden="true">💬🚨</div><h1>GROUP CHAT <em>CRIMES.</em></h1><p class="lead">Five questionable decisions. One very public verdict. Are you the problem?</p><button class="button" id="start">PUT ME ON TRIAL →</button><p class="disclaimer">For laughs only. No data sent. No account needed.</p>';document.getElementById("start").addEventListener("click",start);return;}
 if(!finished){const item=questions[index];main.innerHTML='<div class="panel"><span class="eyebrow">EVIDENCE '+(index+1)+' / '+questions.length+'</span><div class="progress" role="progressbar" aria-valuenow="'+index+'" aria-valuemin="0" aria-valuemax="'+questions.length+'" aria-label="Quiz progress"><i style="width:'+Math.round(index/questions.length*100)+'%"></i></div><h2 class="question">'+escapeHtml(item.q)+'</h2><div class="answers">'+item.a.map(([a,v])=>'<button class="answer" data-choice="'+v+'">'+escapeHtml(a)+'</button>').join('')+'</div></div><p class="disclaimer">Tap your most honest answer. Nobody is watching.</p>';main.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.choice))));return;}
 const t=verdict(score);if(!t)return;main.innerHTML='<div class="panel" id="card"><span class="eyebrow">OFFICIAL KIVZUNO VERDICT</span><div class="meter" aria-hidden="true">'+t.icon+'</div><div class="score">'+score+'/10</div><h2 class="verdict">'+t.name+'</h2><p class="desc">'+t.line+'</p><p class="disclaimer">Completely unscientific. Extremely shareable.</p></div><div class="stack"><button class="button" id="share">SHARE MY CRIMINAL RECORD ↗</button><button class="button secondary" id="story">SAVE A STORY CARD ↓</button><button class="button secondary" id="replay">PLAY AGAIN ↻</button></div><p id="notice" class="disclaimer" role="status"></p>';main.querySelector("#share").addEventListener("click",shareResult);main.querySelector("#story").addEventListener("click",saveStory);main.querySelector("#replay").addEventListener("click",start);
}
function resultLink(){const url=new URL(location.href);url.search="?r="+score;url.hash="";return url.href;}
async function shareResult(){const t=verdict(score);if(!t)return;const text="I got "+t.name+" ("+score+"/10) in KIVZUNO Group Chat Crimes. Are you worse?";const url=resultLink();try{if(navigator.share){await navigator.share({title:"Group Chat Crimes — KIVZUNO",text,url});return;}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text+" "+url);notice("Result and link copied. Send it to your group chat!");return;}notice("Share not available. Screenshot your verdict to share it!");}catch(e){if(e?.name!=="AbortError")notice("Sharing blocked. Screenshot the verdict instead.");}}
function notice(message){const el=document.getElementById("notice");if(el)el.textContent=message;}
async function saveStory(){const t=verdict(score);if(!t)return;const canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1920;const c=canvas.getContext("2d");if(!c){notice("Story export isn't supported by this browser.");return;}const grad=c.createLinearGradient(0,0,1080,1920);grad.addColorStop(0,"#513070");grad.addColorStop(.65,"#221533");grad.addColorStop(1,"#151028");c.fillStyle=grad;c.fillRect(0,0,1080,1920);c.strokeStyle="#d5ff7366";c.lineWidth=24;c.strokeRect(58,90,964,1740);c.textAlign="center";c.fillStyle="#d5ff73";c.font="900 40px Arial,sans-serif";c.fillText("THE GROUP CHAT TRIAL",540,260);c.font="140px Arial,sans-serif";c.fillText("✳",540,550);c.font="900 205px Arial,sans-serif";c.fillText(score+"/10",540,855);c.font="900 66px Arial,sans-serif";c.fillStyle="#ffffff";const words=t.name.split(" ");let lines=[],line="";for(const w of words){if((line+" "+w).length>19){lines.push(line);line=w;}else line=line?line+" "+w:w;}if(line)lines.push(line);lines.forEach((l,i)=>c.fillText(l,540,1020+i*88));c.font="43px Arial,sans-serif";c.fillStyle="#e5dcee";c.fillText("ARE YOU THE PROBLEM?",540,1430);c.fillStyle="#d5ff73";c.font="bold 39px Arial,sans-serif";c.fillText("PLAY GROUP CHAT CRIMES",540,1520);c.font="bold 43px Arial,sans-serif";c.textAlign="right";c.fillStyle="#ffffff";c.fillText("KIVZUNO",974,1760);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob){notice("Story image export failed.");return;}const file=new File([blob],"KIVZUNO_Group_Chat_Crimes.png",{type:"image/png"});try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:"KIVZUNO Group Chat Crimes"});return;}}catch(e){if(e?.name==="AbortError")return;}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notice("Story card saved or opened. On iPhone, use Share → Save Image / Save to Files.");}
const incoming=new URLSearchParams(location.search).get("r");const n=Number(incoming);if(incoming!==null&&/^\d{1,2}$/.test(incoming)&&verdict(n)){score=n;finished=true;index=questions.length;}render();
</script></body></html>
