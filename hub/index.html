function track(event,app){
  if(navigator.globalPrivacyControl===true||navigator.doNotTrack==="1")return;
  const payload=JSON.stringify({event,app,source});
  const endpoint="/.netlify/functions/metrics";
  try{
    if(navigator.sendBeacon){
      const sent=navigator.sendBeacon(endpoint,new Blob([payload],{type:"application/json"}));
      if(sent)return;
    }
    fetch(endpoint,{method:"POST",body:payload,headers:{"content-type":"application/json"},keepalive:true,credentials:"same-origin"}).catch(()=>{});
  }catch(_){ /* Analytics never prevent gameplay. */ }
}

}
function lockIn(){const a=state.lockin;if(a.length===lockin.length){const productive=a.filter(v=>v===0).length;const pct=Math.round(productive/lockin.length*100);let label,emoji,desc;if(productive>=6){label="ACTUALLY LOCKED IN";emoji="🔒";desc="Suspicious. You appear to be doing the task instead of preparing to do the task.";}else if(productive>=4){label="ONE-TAB MIRACLE";emoji="⚡";desc="You can focus. You just occasionally need a ceremonial playlist, snack and minor identity reset.";}else if(productive>=2){label="PRODUCTIVITY COSPLAY";emoji="📋";desc="The system is beautiful. The colour coding is elite. The task would also like some attention.";}else{label="DEADLINE GOBLIN";emoji="👹";desc="Why work calmly today when tomorrow can provide supernatural deadline powers?";}currentShare="My Lock-In Receipt: "+pct+"% — "+label+". Take the KIVZUNO reality check: "+location.origin+location.pathname+"#lockin";wrapper(emoji,"Locked In or Just Making Lists?","Seven brutally honest choices. No productivity guru required.","YOUR LOCK-IN RECEIPT",'<div class="resultsicon">'+emoji+'</div><p class="resultlabel">LOCK-IN SCORE</p><h2>'+pct+'% · '+label+'</h2><p class="resulttext">'+desc+'</p>'+buttonRow("lockin"));return;}const i=a.length;wrapper("🔒","Locked In or Just Making Lists?","Seven brutally honest choices about what happens after you say: I am locking in.","FREE · REALITY CHECK",'<div class="small">CHECK '+(i+1)+' / '+lockin.length+'</div><div class="progress"><i style="width:'+(100*i/lockin.length)+'%"></i></div><h2>'+lockin[i][0]+'</h2><div class="answers"><button class="answer" data-lockin="0">'+lockin[i][1]+'</button><button class="answer" data-lockin="1">'+lockin[i][2]+'</button></div>');}
function sameBrain(){const params=new URLSearchParams(location.search),challenge=params.get("sb"),mine=state.samebrain;if(challenge&&mine.length===5){const other=challenge.split("").map(Number).slice(0,5),matches=mine.filter((v,i)=>v===other[i]).length,pct=matches*20,label=pct>=80?"ONE SHARED BRAIN CELL":pct>=60?"SUSPICIOUSLY SYNCHRONISED":pct>=40?"SAME PLANET, DIFFERENT WIFI":"PARALLEL UNIVERSES";currentShare="We got "+pct+"% on SAME BRAIN? — "+label+". Try it: "+location.origin+location.pathname+"#samebrain";wrapper("🧠","Same Brain?","Five choices. One friendship audit.","YOUR MATCH",'<div class="resultsicon">🧠</div><p class="resultlabel">YOU MATCHED</p><h2>'+pct+'% · '+label+'</h2><p class="resulttext">You agreed on '+matches+' of 5 completely serious scientific questions.</p>'+buttonRow("samebrain"));return;}if(mine.length===5){const code=mine.join(""),url=location.origin+location.pathname+"?sb="+code+"#samebrain";currentShare="SAME BRAIN? I picked my 5. Your turn: "+url;wrapper("🧠","Same Brain?","Your answers are locked. Send the challenge to one person.","CHALLENGE READY",'<h2>Now test somebody else.</h2><p class="resulttext">They answer the same five choices, then KIVZUNO reveals your match.</p><div class="buttons"><button class="btn" data-action="shareSame" data-url="'+url+'">↗ SHARE CHALLENGE</button><button class="btn secondary" data-action="copySame" data-url="'+url+'">COPY LINK</button><button class="btn secondary" data-action="restart" data-id="samebrain">↻ START OVER</button></div><p class="note">The challenge code contains only your five A/B choices. No account or name is required.</p>');return;}const i=mine.length;wrapper("🧠","Same Brain?","Five fast choices. Then send your challenge to a friend.","FREE · FRIEND CHALLENGE",'<div class="small">CHOICE '+(i+1)+' / 5</div><div class="progress"><i style="width:'+(100*i/5)+'%"></i></div><h2>'+samebrain[i][0]+'</h2><div class="answers"><button class="answer" data-same="0">'+samebrain[i][1]+'</button><button class="answer" data-same="1">'+samebrain[i][2]+'</button></div>');}
function panic(){const topics=Object.keys(panicLines);wrapper("🚨","Panic Button for Adults","Real problems. Impressively questionable solutions.","FREE · ZERO PROFESSIONAL ADVICE",'<div class="small">SELECT YOUR EMERGENCY</div><div class="minirow">'+topics.map(t=>'<button data-topic="'+t+'" aria-pressed="'+(state.panicTopic===t)+'">'+t+'</button>').join("")+'</div><div class="output" id="panicOutput" aria-live="polite">Press the button. A terrible solution awaits.</div><div class="buttons"><button class="btn" data-action="generate">🚨 PANIC BUTTON</button><button class="btn secondary" data-action="copyPanic">COPY RESULT</button><a class="btn secondary" href="#home">MORE APPS →</a></div><p class="note">All results are fictional jokes. Please do not present these to your HR department as evidence.</p>');}
function route(){const id=location.hash.slice(1)||"home";visit(["battery","flag","premium","panic","samebrain","lockin"].includes(id)?id:"home");if(id==="battery"||id==="flag"||id==="premium")quiz(id);else if(id==="samebrain")sameBrain();else if(id==="lockin")lockIn();else if(id==="panic")panic();else home();document.title=(id==="home"?"KIVZUNO":(cards.find(c=>c.href==="#"+id)||{}).title||"KIVZUNO")+" — Tiny apps. Unexpected fun.";window.scrollTo({top:0,behavior:"instant"});}
function toast(message){const t=document.getElementById("toast");t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2500);}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast("Copied! Go spread the chaos.");}catch(e){window.prompt("Copy this text:",value);}}
document.addEventListener("click",e=>{
const li=e.target.closest("[data-lockin]");if(li){if(state.lockin.length===0)track("start","lockin");state.lockin.push(Number(li.dataset.lockin));if(state.lockin.length===lockin.length)track("complete","lockin");lockIn();return;}
const same=e.target.closest("[data-same]");if(same){if(state.samebrain.length===0)track("start","samebrain");state.samebrain.push(Number(same.dataset.same));if(state.samebrain.length===5)track("complete","samebrain");sameBrain();return;}
const answer=e.target.closest("[data-answer]");if(answer){const id=answer.dataset.id;if(state[id].length===0)track("start",id);state[id].push(Number(answer.dataset.answer));if(state[id].length===(id==="battery"?battery:id==="flag"?flag:premium).length)track("complete",id);quiz(id);return;}
const topic=e.target.closest("[data-topic]");if(topic){state.panicTopic=topic.dataset.topic;state.panicIndex=-1;panic();return;}
const action=e.target.closest("[data-action]");if(!action)return;const id=action.dataset.id;
if(action.dataset.action==="restart"){state[id]=[];if(id==="samebrain")sameBrain();else if(id==="lockin")lockIn();else quiz(id);}
if(action.dataset.action==="shareSame"){const url=action.dataset.url;if(navigator.share){navigator.share({title:"Same Brain? — KIVZUNO",text:"I picked my five. Your turn.",url}).catch(()=>{});}else copyText(url);}
if(action.dataset.action==="copySame"){copyText(action.dataset.url);}
if(action.dataset.action==="premiumOffer"){track("premium_click",id);location.hash="#premium";}
if(action.dataset.action==="back"){state[id].pop();quiz(id);}
if(action.dataset.action==="share"){const value=currentShare; if(navigator.share){navigator.share({title:"KIVZUNO",text:value,url:location.href}).catch(()=>{});}else copyText(value);}
if(action.dataset.action==="generate"){if(state.panicIndex<0)track("start","panic");track("complete","panic");const arr=panicLines[state.panicTopic];let i=Math.floor(Math.random()*arr.length);if(i===state.panicIndex)i=(i+1)%arr.length;state.panicIndex=i;const out=document.getElementById("panicOutput");out.style.animation="none";out.offsetHeight;out.style.animation="pop .3s";out.textContent="“"+arr[i]+"”";}
if(action.dataset.action==="copyPanic"){const i=state.panicIndex;if(i<0){toast("Press PANIC first.");return;}copyText(panicLines[state.panicTopic][i]+" — KIVZUNO "+location.href);}
});
window.addEventListener("hashchange",route);route();
</script></body></html>
