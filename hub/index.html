function track(event,app){
  if(navigator.globalPrivacyControl===true||navigator.doNotTrack==="1")return;
  const payload=JSON.stringify({event,app,source});
  const endpoint="/.netlify/functions/metrics";
  try{
    if(navigator.sendBeacon){
      const sent=navigator.sendBeacon(endpoint,new Blob([payload],{type:"application/json"}));
      if(sent)return;
    }
    fetch(endpoint,{method:"POST",body:payload,headers:{"content-type":"application/json"},keepalive:true,credentials:"same-origin"}).catch(()=>{});
  }catch(_){ /* Analytics never prevent gameplay. */ }
}

const i=a.length,options=id==="battery"||id==="premium"?items[i].slice(1).map((t,j)=>({t,v:j})):items[i].slice(1).map((t,j)=>({t,v:j}));
wrapper(id==="battery"?"🔋":id==="flag"?"🚩":"⚡",title,subtitle,id==="premium"?"PREMIUM PRODUCT DEMO · NO CHARGE":"FREE · JUST FOR FUN",'<div class="small">QUESTION '+(i+1)+' / '+items.length+'</div><div class="progress" role="progressbar" aria-valuenow="'+i+'" aria-valuemin="0" aria-valuemax="'+items.length+'" aria-label="Quiz progress"><i style="width:'+(100*i/items.length)+'%"></i></div><h2>'+items[i][0]+'</h2><div class="answers">'+options.map(o=>'<button class="answer" data-answer="'+o.v+'" data-id="'+id+'">'+o.t+'</button>').join("")+'</div><div class="buttons">'+(i?'<button class="btn secondary" data-action="back" data-id="'+id+'">← PREVIOUS</button>':"")+'<a class="btn secondary" href="#home">EXIT</a></div>');
}
let currentShare="";
function result(id,title,subtitle){
const s=state[id],total=s.reduce((x,y)=>x+y,0);
let label,emoji,desc,extra="";
if(id==="battery"){if(total<=4){label="THE PROFESSIONAL HIBERNATOR";emoji="🛌";desc="Your energy is a limited-edition collectible. You appreciate people, preferably from a comfortable distance.";}else if(total<=9){label="THE SELECTIVE SOCIALITE";emoji="🪫";desc="You enjoy company in carefully measured doses. Snacks and an exit strategy are non-negotiable.";}else{label="THE HUMAN POWER BANK";emoji="🔌";desc="You enter a room and accidentally organise a festival. Remember: other people sometimes need a nap.";} }
if(id==="flag"){const count=s.filter(v=>v===0).length;emoji=count>=6?"🚨":count>=3?"🕵️":"🧘";label=count>=6?"THE FULL-TIME RED FLAG DETECTOR":count>=3?"THE CAUTIOUS VIBE INSPECTOR":"THE MAYBE IT'S FINE DIPLOMAT";desc="You flagged "+count+" out of 8 scenarios. This is a comedy quiz, not a diagnostic tool. Real people deserve nuance.";}
if(id==="premium"){const kinds=[["THE LAST-MINUTE LEGEND","🌪️","You run on deadlines, caffeine and extraordinary plot twists.","Your kryptonite: a reasonable schedule.","Survival protocol: do the two-minute version first.","Official motto: I work best under entirely avoidable pressure."],["THE GRAND OVERTHINKER","🧠","You can forecast fourteen futures before breakfast. Not one involves an uneventful Tuesday.","Your kryptonite: the simple yes-or-no question.","Survival protocol: set a five-minute decision timer.","Official motto: What if, but in twelve languages."],["THE CREATIVE DISRUPTOR","🎨","You turn ordinary problems into experimental side quests. Somehow people still ask you for ideas.","Your kryptonite: instructions containing the word normal.","Survival protocol: finish one strange thing before inventing five more.","Official motto: That sounds unnecessary. I'm in."]];
const kind=kinds[total%3];[label,emoji,desc]=kind;extra='<div class="minirow"><span class="pill">'+kind[3]+'</span></div><p class="resulttext">'+kind[4]+'</p><p class="resulttext">'+kind[5]+'</p><p class="note">DEMO MODE: this is working premium-result content, currently free to test. No payment is requested or collected here. A verified purchase flow must be connected before public paid sales.</p>';}
currentShare=title+" — "+label+". "+desc+" Play: "+location.origin+location.pathname+"#"+id;
if(id==="battery"||id==="flag"){
  extra+='<section style="margin-top:28px;padding:20px;background:#ceff7014;border:1px solid #ceff7066;border-radius:16px"><span class="small">WANT MORE CHAOS?</span><h2 style="margin:10px 0">Meet the Premium Chaos Lab ⚡</h2><p class="resulttext">An extended 10-question personality profile, your ridiculous weakness and survival tips. One-time £0.99 when launched. <strong>Full free demo available now — no payment requested.</strong></p><button class="btn" data-action="premiumOffer" data-id="'+id+'">TRY PREMIUM DEMO →</button></section>';
}
wrapper(emoji,title,subtitle,id==="premium"?"COMPLETE PRODUCT DEMO · CHECKOUT NOT LIVE":"YOUR COMPLETELY UNSCIENTIFIC RESULT",'<div class="confetti" aria-hidden="true">✳ ✦ ✳</div><div class="resultsicon" aria-hidden="true">'+emoji+'</div><p class="resultlabel">YOUR RESULT</p><h2>'+label+'</h2><p class="resulttext">'+desc+'</p>'+extra+buttonRow(id));
}
function panic(){const topics=Object.keys(panicLines);wrapper("🚨","Panic Button for Adults","Real problems. Impressively questionable solutions.","FREE · ZERO PROFESSIONAL ADVICE",'<div class="small">SELECT YOUR EMERGENCY</div><div class="minirow">'+topics.map(t=>'<button data-topic="'+t+'" aria-pressed="'+(state.panicTopic===t)+'">'+t+'</button>').join("")+'</div><div class="output" id="panicOutput" aria-live="polite">Press the button. A terrible solution awaits.</div><div class="buttons"><button class="btn" data-action="generate">🚨 PANIC BUTTON</button><button class="btn secondary" data-action="copyPanic">COPY RESULT</button><a class="btn secondary" href="#home">MORE APPS →</a></div><p class="note">All results are fictional jokes. Please do not present these to your HR department as evidence.</p>');}
function studio(){main.innerHTML="<div class=\"studio\"><section class=\"studio-hero\" aria-labelledby=\"studio-title\"><div><p class=\"kicker\">Independent digital innovation studio</p><h1 id=\"studio-title\">Practical digital products.<br><span>Built with purpose.</span></h1><p class=\"lead\">KIVZUNO develops focused digital tools that simplify real work. Our current priority is LAYERON Training Compliance, a platform designed for UK training providers and independent trainers.</p><div class=\"studio-actions\"><a class=\"studio-link primary\" href=\"https://layeron-demo.netlify.app/\">Explore LAYERON <span aria-hidden=\"true\">↗</span></a><a class=\"studio-link\" href=\"#layeron\">About the product <span aria-hidden=\"true\">↓</span></a></div><p class=\"fine\">Independent development · UK-focused · Public testing in preparation</p></div><div class=\"product-visual\" aria-label=\"Illustration of the intended LAYERON workflow\"><div class=\"visual-head\"><span class=\"visual-brand\"><i>◇</i> LAYERON</span><span class=\"visual-label\">Product concept</span></div><div class=\"visual-body\"><p class=\"visual-caption\">TRAINING COMPLIANCE</p><h2 class=\"visual-title\" style=\"font-size:25px;margin:0\">One place for training records.</h2><div class=\"visual-card\"><strong>Training workspace</strong><span>Organise your training activity and participant records.</span></div><div class=\"visual-flow\"><div><b>01 · ORGANISE</b> Courses and sessions</div><div><b>02 · RECORD</b> Participants</div><div><b>03 · ISSUE</b> Certificates</div><div><b>04 · VERIFY</b> Certificate records</div></div><p class=\"visual-caption\">Illustrative workflow, not a live dashboard.</p></div></div></section><div class=\"studio-band\"><div><strong>Purpose-led</strong><span>Real problems before extra features</span></div><div><strong>Built for the UK</strong><span>Training providers and independent trainers</span></div><div><strong>Feedback-driven</strong><span>Improve through practical user testing</span></div></div><section id=\"layeron-product\" class=\"studio-section\"><p class=\"kicker\">01 / Flagship product</p><h2>LAYERON Training Compliance</h2><p>Designed to bring training administration, certificate management and verification into a single workflow. The platform is being developed and tested; features and availability may change.</p><div class=\"studio-grid\"><article class=\"studio-item\"><span class=\"number\">01</span><h3>Manage training</h3><p>Bring course, session and participant records together instead of relying on scattered spreadsheets.</p></article><article class=\"studio-item\"><span class=\"number\">02</span><h3>Issue certificates</h3><p>A planned streamlined workflow for creating professional training certificates and managing their records.</p></article><article class=\"studio-item\"><span class=\"number\">03</span><h3>Support verification</h3><p>Make certificate checks easier with a dedicated verification workflow. LAYERON does not confer accreditation.</p></article></div><div class=\"studio-actions\"><a class=\"studio-link primary\" href=\"https://layeron-demo.netlify.app/\">Visit the product demo <span aria-hidden=\"true\">↗</span></a></div><p class=\"fine\">Development preview. Do not enter sensitive or real learner data until the testing terms and security checks are confirmed.</p></section><section id=\"studio-about\" class=\"studio-section studio-split\"><div><p class=\"kicker\">02 / The studio</p><h2>Focus on what works.</h2></div><div><p>Our approach is to identify a practical problem, build a usable solution and listen to the people who will use it. LAYERON is our main development focus.</p><p>Earlier interactive experiments remain available in KIVZUNO Lab, separate from the studio's professional product work.</p><a class=\"studio-link\" href=\"#home\">Explore the experimental archive <span aria-hidden=\"true\">↗</span></a></div></section><section class=\"studio-close\"><p class=\"kicker\">03 / Product testing</p><h2>Help shape the next version of LAYERON.</h2><p>We are interested in hearing from UK trainers and training organisations about their current workflows and what a useful training administration platform should do.</p><div class=\"studio-actions\"><a class=\"studio-link primary\" href=\"https://layeron-demo.netlify.app/\">Explore the development demo <span aria-hidden=\"true\">↗</span></a></div></section></div>";}
function route(){const id=location.hash.slice(1)||"studio";const isStudio=["studio","layeron","about"].includes(id);document.body.classList.toggle("studio-mode",isStudio);visit(["battery","flag","premium","panic"].includes(id)?id:"home");if(id==="battery"||id==="flag"||id==="premium")quiz(id);else if(id==="panic")panic();else if(isStudio)studio();else home();document.title=isStudio?"KIVZUNO | Digital Innovation Studio":(id==="home"?"KIVZUNO Lab":(cards.find(c=>c.href==="#"+id)||{}).title||"KIVZUNO Lab")+" — Interactive experiments";if(id==="layeron"||id==="about"){document.getElementById(id==="layeron"?"layeron-product":"studio-about")?.scrollIntoView();}else window.scrollTo({top:0,behavior:"instant"});}
function toast(message){const t=document.getElementById("toast");t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2500);}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast("Copied! Go spread the chaos.");}catch(e){window.prompt("Copy this text:",value);}}
document.addEventListener("click",e=>{
const answer=e.target.closest("[data-answer]");if(answer){const id=answer.dataset.id;if(state[id].length===0)track("start",id);state[id].push(Number(answer.dataset.answer));if(state[id].length===(id==="battery"?battery:id==="flag"?flag:premium).length)track("complete",id);quiz(id);return;}
const topic=e.target.closest("[data-topic]");if(topic){state.panicTopic=topic.dataset.topic;state.panicIndex=-1;panic();return;}
const action=e.target.closest("[data-action]");if(!action)return;const id=action.dataset.id;
if(action.dataset.action==="restart"){state[id]=[];quiz(id);}
if(action.dataset.action==="premiumOffer"){track("premium_click",id);location.hash="#premium";}
if(action.dataset.action==="back"){state[id].pop();quiz(id);}
if(action.dataset.action==="share"){const value=currentShare; if(navigator.share){navigator.share({title:"KIVZUNO",text:value,url:location.href}).catch(()=>{});}else copyText(value);}
if(action.dataset.action==="generate"){if(state.panicIndex<0)track("start","panic");track("complete","panic");const arr=panicLines[state.panicTopic];let i=Math.floor(Math.random()*arr.length);if(i===state.panicIndex)i=(i+1)%arr.length;state.panicIndex=i;const out=document.getElementById("panicOutput");out.style.animation="none";out.offsetHeight;out.style.animation="pop .3s";out.textContent="“"+arr[i]+"”";}
if(action.dataset.action==="copyPanic"){const i=state.panicIndex;if(i<0){toast("Press PANIC first.");return;}copyText(panicLines[state.panicTopic][i]+" — KIVZUNO "+location.href);}
});
window.addEventListener("hashchange",route);route();
</script></body></html>
