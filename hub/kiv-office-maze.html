<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIV: Office Maze | KIVZUNO</title><style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#e9faff;font:16px system-ui;text-align:center}h1{color:#52d6fb;margin:14px 0 4px}p{margin:7px}.levels{display:flex;justify-content:center;gap:8px;margin:12px;flex-wrap:wrap}button,a{font:inherit;background:#234d69;color:white;border:2px solid #5ecaf4;border-radius:10px;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#1d849b}button:focus-visible,a:focus-visible{outline:3px solid #fff}canvas{width:min(94vw,440px);height:auto;display:block;margin:10px auto;border:3px solid #58bbdf;border-radius:12px;background:#182c47;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,65px);gap:6px;justify-content:center}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}#status{min-height:42px;color:#ffdf80;font-weight:600}footer{font-size:12px;color:#adc1d1;margin:15px}</style></head><body><h1>🤖 KIV: OFFICE MAZE</h1><p>THE GREAT ESCAPE — PLAY THE EPISODES</p><div class="levels"><button id="l1" aria-pressed="true">Level 1 · Moving Maze</button><button id="l2" aria-pressed="false">Level 2 · Wrong Turn</button><button id="l3" aria-pressed="false">Level 3 · The Airlock</button><button id="l4" aria-pressed="false">Level 4 · Desktop Giant</button></div><p id="objective"></p><p id="status" role="status" aria-live="polite"></p><p>Time: <span id="time">0</span>s · Best: <span id="best">—</span>s</p><canvas id="game" width="420" height="420" aria-label="Office maze game board"></canvas><div class="pad"><button data-d="0,-1" aria-label="Move up">▲</button><button data-d="-1,0" aria-label="Move left">◀</button><button data-d="0,1" aria-label="Move down">▼</button><button data-d="1,0" aria-label="Move right">▶</button></div><p><button id="restart">Restart level</button> <a href="/">← KIVZUNO HUB</a></p><footer>Free · No sign-up · Best time saved on your device only · Original code and graphics</footer><script>
"use strict";
const levels=[
{title:"MOVING MAZE",goal:"Collect the keycard, avoid the security drone and reach EXIT.",map:["##########","#S..#....#","#.#.#.##.#","#.#......#","#.####.#.#","#....#.#.#","###..#...#","#....##..#","#.##...KE#","##########"],item:"K",exit:"E",hazard:{x:7,y:3,dir:1}},
{title:"THE WRONG TURN",goal:"Collect the ventilation tool, dodge the shredders and escape through the vent.",map:["##########","#S.......#","#.###.##.#","#...#....#","###.#.##.#","#...#....#","#.###.##.#","#......#.#","#.####.TV#","##########"],item:"T",exit:"V",hazard:{x:5,y:3,dir:1},hazard2:{x:6,y:7,dir:-1}},
{title:"THE AIRLOCK",goal:"Grab the paper parachute, avoid the fans and escape through the airlock.",map:["##########","#S.......#","#.###.##.#","#...#....#","###.#.##.#","#...#....#","#.###.##.#","#......#.#","#.####.PA#","##########"],item:"P",exit:"A",hazard:{x:6,y:1,dir:-1},hazard2:{x:5,y:7,dir:1}},
{title:"THE DESKTOP GIANT",goal:"Collect the paperclip, dodge the giant staplers and reach the drawer elevator.",map:["##########","#S.......#","#.###.##.#","#...#....#","###.#.##.#","#...#....#","#.###.##.#","#......#.#","#.####.CD#","##########"],item:"C",exit:"D",hazard:{x:6,y:1,dir:-1},hazard2:{x:5,y:7,dir:1}}];
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),status=document.getElementById("status"),time=document.getElementById("time"),best=document.getElementById("best");
let level=0,p,got,won,started,steps,hazards;const key=n=>"kiv-office-maze-best-l"+(n+1);
function wall(x,y){return x<0||y<0||x>=10||y>=10||levels[level].map[y][x]==="#"}
function locate(char){for(let y=0;y<10;y++)for(let x=0;x<10;x++)if(levels[level].map[y][x]===char)return{x,y};throw Error("Missing map item "+char)}
function load(n){level=n;document.getElementById("l1").setAttribute("aria-pressed",String(n===0));document.getElementById("l2").setAttribute("aria-pressed",String(n===1));document.getElementById("l3").setAttribute("aria-pressed",String(n===2));document.getElementById("l4").setAttribute("aria-pressed",String(n===3));document.getElementById("objective").textContent=levels[n].goal;try{best.textContent=localStorage.getItem(key(n))||"—"}catch{best.textContent="—"}reset()}
function reset(){p=locate("S");got=false;won=false;steps=0;started=performance.now();hazards=[{...levels[level].hazard},...(levels[level].hazard2?[{...levels[level].hazard2}]:[])];status.textContent=["Find the gold keycard!","Find the ventilation tool!","Find the paper parachute!","Find the giant paperclip!"][level];time.textContent="0";draw()}
function move(dx,dy){if(won)return;const nx=p.x+dx,ny=p.y+dy;if(wall(nx,ny))return;p={x:nx,y:ny};steps++;const def=levels[level],item=locate(def.item),exit=locate(def.exit);if(nx===item.x&&ny===item.y){got=true;status.textContent=["KEYCARD ACQUIRED! Reach EXIT!","VENT TOOL FOUND! Find the ventilation shaft!","PARACHUTE FOUND! Reach the AIRLOCK!","PAPERCLIP FOUND! Reach the DRAWER!"][level]}
if(steps%2===0)for(const h of hazards){let x=h.x+h.dir;if(wall(x,h.y)){h.dir*=-1;x=h.x+h.dir}if(!wall(x,h.y))h.x=x}
if(hazards.some(h=>h.x===p.x&&h.y===p.y)){status.textContent=["SECURITY CAUGHT KIV! Back to start.","SHREDDER ALERT! Back to start.","FAN BLAST! KIV is blown back to start.","STAPLER ATTACK! Back to start."][level];p=locate("S");got=false;steps=0}
if(p.x===exit.x&&p.y===exit.y){if(got){won=true;const secs=Math.max(1,Math.round((performance.now()-started)/1000));status.textContent=["ESCAPED LEVEL 1! Try THE WRONG TURN!","LEVEL 2 COMPLETE! KIV FOUND THE VENT!","LEVEL 3 COMPLETE! KIV REACHED THE AIRLOCK!","LEVEL 4 COMPLETE! NEXT STOP: FLOOR -99!"][level];try{const old=Number(localStorage.getItem(key(level)));if(!old||secs<old)localStorage.setItem(key(level),String(secs));best.textContent=localStorage.getItem(key(level))}catch{}}else status.textContent="Find the item before escaping!"}draw()}
function draw(){ctx.clearRect(0,0,420,420);const def=levels[level];for(let y=0;y<10;y++)for(let x=0;x<10;x++){const t=def.map[y][x],X=x*42,Y=y*42;ctx.fillStyle=t==="#"?"#304e6a":"#14263f";ctx.fillRect(X,Y,41,41);if(t===def.item&&!got){ctx.fillStyle="#ffd367";ctx.fillRect(X+9,Y+12,24,18);ctx.fillStyle="#23364b";ctx.font="bold 11px system-ui";ctx.fillText(t,X+17,Y+25)}if(t===def.exit){ctx.fillStyle=got?"#55df9d":"#68788d";ctx.fillRect(X+5,Y+5,32,33);ctx.fillStyle="#17344a";ctx.font="bold 10px system-ui";ctx.fillText(t==="V"?"VENT":t==="A"?"AIR":t==="D"?"LIFT":"EXIT",X+6,Y+25)}}
for(const h of hazards){const X=h.x*42+21,Y=h.y*42+21;ctx.fillStyle=level===0?"#ff5f84":level===1?"#f6a34a":level===3?"#ff5f84":"#76cfff";ctx.beginPath();ctx.arc(X,Y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#182c47";ctx.fillRect(X-7,Y-3,14,6);if(level===1){ctx.strokeStyle="#ffe0b4";for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(X-8,Y+i*6);ctx.lineTo(X+8,Y+i*6);ctx.stroke()}}if(level===3){ctx.fillStyle="#fff";ctx.fillRect(X-8,Y-3,16,6)}if(level===2){ctx.strokeStyle="#eaffff";ctx.lineWidth=3;for(let i=0;i<4;i++){const a=i*Math.PI/2+steps*.4;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+Math.cos(a)*13,Y+Math.sin(a)*13);ctx.stroke()}ctx.lineWidth=1}}
const X=p.x*42+21,Y=p.y*42+21;ctx.fillStyle="#edfaff";ctx.fillRect(X-15,Y-17,30,29);ctx.fillStyle="#132b46";ctx.fillRect(X-12,Y-14,24,17);ctx.fillStyle="#4bd7fa";ctx.beginPath();ctx.arc(X-6,Y-6,3.4,0,7);ctx.arc(X+6,Y-6,3.4,0,7);ctx.fill();ctx.fillStyle="#182c47";ctx.font="bold 9px system-ui";ctx.fillText("KIV",X-9,Y+8)}
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{const [x,y]=b.dataset.d.split(",").map(Number);move(x,y)}));
document.addEventListener("keydown",e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});
document.getElementById("restart").addEventListener("click",reset);document.getElementById("l1").addEventListener("click",()=>load(0));document.getElementById("l2").addEventListener("click",()=>load(1));document.getElementById("l3").addEventListener("click",()=>load(2));document.getElementById("l4").addEventListener("click",()=>load(3));setInterval(()=>{if(!won)time.textContent=String(Math.floor((performance.now()-started)/1000))},250);load(0);
</script></body></html>
