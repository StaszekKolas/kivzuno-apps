<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIV: Office Maze | KIVZUNO</title><style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#e9faff;font:16px system-ui;text-align:center}h1{color:#52d6fb;margin:15px 0 4px}p{margin:6px}canvas{width:min(95vw,460px);height:auto;display:block;margin:12px auto;border:3px solid #58bbdf;border-radius:12px;background:#182c47}button,a{font:inherit;background:#234d69;color:white;border:2px solid #5ecaf4;border-radius:10px;padding:12px;cursor:pointer}a{display:inline-block;text-decoration:none;margin:10px}.pad{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}#status{min-height:25px;color:#ffdf80}footer{font-size:12px;color:#adc1d1;margin:15px}</style><h1>🤖 KIV: OFFICE MAZE</h1><p>THE GREAT ESCAPE · LEVEL 1</p><p>Collect the keycard. Avoid security. Reach EXIT!</p><p id="status" role="status">Use arrow keys, WASD or touch controls.</p><p>Time: <span id="time">0</span>s · Best: <span id="best">—</span>s</p><canvas id="game" width="420" height="420" aria-label="Office maze"></canvas><div class="pad"><button data-d="0,-1" aria-label="Up">▲</button><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div><button id="restart">Restart</button><a href="/">← KIVZUNO HUB</a><footer>Free · No account · Best time stored only on your device · KIVZUNO ORIGINALS</footer><script>
const map=['##########','#S..#....#','#.#.#.##.#','#.#......#','#.####.#.#','#....#.#.#','###..#...#','#....##..#','#.##...KE#','##########'];const c=document.querySelector('canvas'),g=c.getContext('2d'),status=document.querySelector('#status'),time=document.querySelector('#time'),best=document.querySelector('#best');let p,card,win,start,guard,steps;const store='kiv-office-maze-l1';try{best.textContent=localStorage.getItem(store)||'—'}catch{}function wall(x,y){return x<0||x>=10||y<0||y>=10||map[y][x]==='#'}function reset(){p={x:1,y:1};card=false;win=false;steps=0;guard={x:7,y:3,dir:1};start=performance.now();status.textContent='Find the gold keycard!';draw()}function move(dx,dy){if(win)return;let x=p.x+dx,y=p.y+dy;if(wall(x,y))return;p={x,y};steps++;if(x===7&&y===8){card=true;status.textContent='KEYCARD ACQUIRED! Find EXIT!'}if(steps%2===0){let nx=guard.x+guard.dir;if(wall(nx,guard.y)){guard.dir*=-1;nx=guard.x+guard.dir}guard.x=nx}if(p.x===guard.x&&p.y===guard.y){status.textContent='SECURITY CAUGHT KIV! Try again.';p={x:1,y:1};card=false;steps=0}if(p.x===8&&p.y===8&&card){win=true;let s=Math.max(1,Math.round((performance.now()-start)/1000));status.textContent='ESCAPED! 🎉 LEVEL 1 COMPLETE!';try{let old=Number(localStorage.getItem(store));if(!old||s<old)localStorage.setItem(store,String(s));best.textContent=localStorage.getItem(store)}catch{}}draw()}function draw(){g.clearRect(0,0,420,420);for(let y=0;y<10;y++)for(let x=0;x<10;x++){let t=map[y][x],X=x*42,Y=y*42;g.fillStyle=t==='#'?'#304e6a':'#14263f';g.fillRect(X,Y,41,41);if(t==='K'&&!card){g.fillStyle='#ffd367';g.fillRect(X+10,Y+11,24,17);g.fillStyle='white';g.fillRect(X+16,Y+15,12,3)}if(t==='E'){g.fillStyle=card?'#55df9d':'#68788d';g.fillRect(X+5,Y+4,32,35);g.fillStyle='#072';g.font='11px sans-serif';g.fillText('EXIT',X+7,Y+26)}}g.fillStyle='#ff5f84';g.beginPath();g.arc(guard.x*42+21,guard.y*42+21,14,0,7);g.fill();g.fillStyle='white';g.fillRect(guard.x*42+16,guard.y*42+18,10,5);let X=p.x*42+21,Y=p.y*42+21;g.fillStyle='#edfaff';g.fillRect(X-14,Y-17,28,29);g.fillStyle='#132b46';g.fillRect(X-11,Y-13,22,16);g.fillStyle='#4bd7fa';g.beginPath();g.arc(X-5,Y-6,3,0,7);g.arc(X+5,Y-6,3,0,7);g.fill();g.fillStyle='#182c47';g.font='bold 8px sans-serif';g.fillText('KIV',X-7,Y+8)}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let [x,y]=b.dataset.d.split(',').map(Number);move(x,y)});document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelector('#restart').onclick=reset;setInterval(()=>{if(!win)time.textContent=Math.floor((performance.now()-start)/1000)},250);reset();</script></html>
